<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小行星軌道數據探究平台 - 惠文高中地科教學工具</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
        #loadingOverlay { display: none; background: rgba(0,0,0,0.8); }
        .type-badge { padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: bold; color: white; display: inline-block; }
        .subtype-badge { padding: 1px 7px; border-radius: 99px; font-size: 0.68rem; font-weight: 700; color: #334155; background: #e2e8f0; display: inline-block; margin: 4px 4px 0 0; }
        #chart { cursor: crosshair; }
        body.theme-dark { background-color: #020617; color: #e2e8f0; }
        body.theme-dark header { background-color: #020617 !important; border-bottom: 1px solid #1f2937; }
        body.theme-dark aside { background-color: #0b1220 !important; border-color: #1f2937 !important; color: #e2e8f0; }
        body.theme-dark #chartSection { background-color: #05070c !important; }
        body.theme-dark .bg-white { background-color: #0f172a !important; }
        body.theme-dark .bg-slate-50 { background-color: #111827 !important; }
        body.theme-dark .border, body.theme-dark .border-r, body.theme-dark .border-t, body.theme-dark .border-b,
        body.theme-dark .border-slate-100, body.theme-dark .border-slate-200, body.theme-dark .border-slate-700 { border-color: #334155 !important; }
        body.theme-dark .text-slate-900, body.theme-dark .text-slate-800, body.theme-dark .text-slate-700, body.theme-dark .text-slate-600 { color: #e2e8f0 !important; }
        body.theme-dark .text-slate-500, body.theme-dark .text-slate-400 { color: #94a3b8 !important; }
        body.theme-dark input, body.theme-dark select { background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }
        body.theme-dark button.bg-slate-100 { background-color: #1e293b !important; color: #e2e8f0 !important; }
        body.theme-dark #searchInfoCard { background-color: #0f172a !important; border-color: #334155 !important; }
        body.theme-dark .subtype-badge { background: #1e293b; color: #cbd5e1; }
        #orbitPlanePanel { width: min(460px, calc(100vw - 2rem)); height: min(390px, calc(100vh - 8rem)); }
        body.theme-dark #orbitPlanePanel { background-color: #0f172a !important; border-color: #334155 !important; color: #e2e8f0; }
        @media (max-width: 760px) { #orbitPlanePanel { left: 0.75rem; right: 0.75rem; bottom: 0.75rem; width: auto; height: 340px; } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .highlight-important { background-color: #fff7cc !important; border: 2px solid #facc15 !important; border-radius: 10px; padding: 6px; }

        /* ── 拖曳上傳遮罩 ── */
        #dragOverlay {
            display: none;
            position: fixed; inset: 0; z-index: 60;
            background: rgba(30, 64, 175, 0.82);
            backdrop-filter: blur(6px);
            flex-direction: column; align-items: center; justify-content: center;
            color: white; pointer-events: none;
        }
        #dragOverlay.active { display: flex; }
        #dragOverlay .drag-box {
            border: 3px dashed rgba(255,255,255,0.75);
            border-radius: 1.5rem; padding: 3rem 4.5rem; text-align: center;
            animation: pulse-dash 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dash {
            0%,100% { border-color: rgba(255,255,255,0.6); box-shadow: 0 0 0 0 rgba(147,197,253,0); }
            50%      { border-color: rgba(255,255,255,1);   box-shadow: 0 0 24px 6px rgba(147,197,253,0.35); }
        }
        body.drag-active #fileDropBtn { box-shadow: 0 0 0 3px rgba(96,165,250,0.7); }
    </style>
</head>
<body class="h-screen flex flex-col">

<!-- 拖曳上傳遮罩 -->
<div id="dragOverlay">
    <div class="drag-box">
        <div style="font-size:4rem;line-height:1;margin-bottom:1rem;">☄️</div>
        <p style="font-size:1.6rem;font-weight:900;margin-bottom:0.4rem;" data-i18n="drag_drop_title">放開以載入軌道檔</p>
        <p style="font-size:0.9rem;opacity:0.8;" data-i18n="drag_drop_hint">支援 MPCORB.DAT / CometEls .txt 格式</p>
    </div>
</div>

<div id="loadingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center text-white">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
    <p class="text-xl font-bold" data-i18n="loading_title">數據處理中...</p>
    <p id="progressText" class="text-sm mt-2 font-mono" data-i18n="loading_progress">正在解析軌道參數...</p>
</div>

<header class="bg-slate-900 text-white p-4 shadow-xl flex justify-between items-center">
    <div class="flex items-center gap-3">
        <span class="text-2xl">☄️</span>
        <h1 class="text-lg font-bold tracking-tight">
            <span data-i18n="title">小行星軌道數據探究平台</span>
            <span class="text-blue-400 font-normal text-sm ml-2" data-i18n="subtitle">小行星的軌道參數與分類</span>
        </h1>
    </div>
    <div class="flex items-center gap-3">
        <input type="file" id="fileInput" accept=".dat,.txt" class="hidden">
        <button id="fileDropBtn" onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg text-sm font-bold shadow-lg transition-all active:scale-95" data-i18n="load_file" title="點擊選擇檔案，或將檔案拖曳至頁面任意位置">
            載入軌道檔
        </button>
        <a href="https://www.minorplanetcenter.net/data" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-300 hover:text-blue-200 underline underline-offset-2 whitespace-nowrap" data-i18n="download_dat">
            下載 MPCORB.DAT
        </a>
        <div id="dataStatus" class="bg-slate-800 px-3 py-1 rounded border border-slate-700 text-xs text-slate-400" data-i18n="data_not_loaded">數據未載入</div>
        <button id="langToggleBtn" onclick="switchLang()"
            class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs text-white transition-all active:scale-95">
            🌐 EN
        </button>
    </div>
</header><main class="flex-1 flex overflow-hidden">
    <aside class="w-80 p-6 overflow-y-auto border-r bg-white shadow-inner flex flex-col gap-6">

        <section class="order-1">
            <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span data-i18n="search_title">搜尋與定位</span>
            </h3>
            <div class="relative">
                <input type="text" id="searchInput" oninput="liveSearch()" placeholder="搜尋..." class="w-full border-2 border-slate-100 p-2.5 rounded-xl text-sm focus:border-blue-500 transition-all outline-none">
            </div>
            <div id="searchInfoCard" class="hidden mt-4 p-4 bg-blue-50 border border-blue-100 rounded-2xl shadow-sm"></div>
        </section>

        <details class="bg-slate-50 rounded-2xl border border-slate-100 order-4">
            <summary class="cursor-pointer select-none p-4 font-bold text-slate-800" data-i18n="advanced_features">進階功能</summary>
            <div class="px-4 pb-4 space-y-5">
                <section>
                    <h3 class="font-bold text-slate-800 mb-3 border-b pb-1" data-i18n="sci_tools">科學分析工具</h3>
                    <div class="flex items-center justify-between mb-3">
                        <label for="showZones" class="text-sm text-slate-600 font-medium" data-i18n="show_zones">顯示行星軌道關係線</label>
                        <input type="checkbox" id="showZones" checked onchange="drawChart()" class="w-5 h-5 accent-blue-600">
                    </div>
                    <div class="flex items-center justify-between mb-3">
                        <label for="showOrbitPlane" class="text-sm text-slate-600 font-medium" data-i18n="show_orbit_plane">顯示軌道平面小畫面</label>
                        <input type="checkbox" id="showOrbitPlane" onchange="drawChart()" class="w-5 h-5 accent-blue-600">
                    </div>
                    <div class="mt-4 border-t border-slate-200 pt-3">
                        <h4 class="text-xs font-bold text-slate-700 mb-2 flex justify-between items-center">
                            <span data-i18n="custom_resonance">✏️ 自訂動力學共振帶</span>
                            <div class="flex items-center gap-1">
                                <input type="checkbox" id="showCustomRes" onchange="drawChart()" class="w-3 h-3 accent-pink-500">
                                <label for="showCustomRes" class="text-[10px] text-slate-500" data-i18n="show_label">顯示</label>
                            </div>
                        </h4>
                        <div class="space-y-2 bg-white p-2 rounded border border-slate-200">
                            <div class="flex items-center gap-2 text-xs">
                                <span class="text-slate-500 font-medium w-12 text-right" data-i18n="target_planet">目標行星</span>
                                <select id="resPlanet" class="border p-1 rounded bg-slate-50 flex-1 outline-none focus:border-pink-400" onchange="drawChart()">
                                    <option value="0.723" data-i18n-opt="venus">金星 (0.7 au)</option>
                                    <option value="1.000" data-i18n-opt="earth">地球 (1.0 au)</option>
                                    <option value="1.524" data-i18n-opt="mars">火星 (1.5 au)</option>
                                    <option value="5.203" selected data-i18n-opt="jupiter">木星 (5.2 au)</option>
                                    <option value="9.537" data-i18n-opt="saturn">土星 (9.5 au)</option>
                                    <option value="19.191" data-i18n-opt="uranus">天王星 (19.2 au)</option>
                                    <option value="30.07" data-i18n-opt="neptune">海王星 (30.1 au)</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-2 text-xs">
                                <span class="text-slate-500 font-medium w-12 text-right" data-i18n="orbit_count">公轉圈數</span>
                                <input type="number" id="resAst" class="w-10 border p-1 rounded text-center outline-none focus:border-pink-400" value="3" min="1" oninput="drawChart()">
                                <span class="text-slate-400 font-bold">:</span>
                                <input type="number" id="resPlan" class="w-10 border p-1 rounded text-center outline-none focus:border-pink-400" value="1" min="1" oninput="drawChart()">
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 border-t border-slate-200 pt-3">
                        <h4 class="text-xs font-bold text-slate-700 mb-2" data-i18n="display_count">顯示筆數</h4>
                        <div class="space-y-2 bg-white p-2 rounded border border-slate-200">
                            <div class="flex items-center gap-2 text-xs">
                                <span class="text-slate-500 font-medium w-16 text-right" data-i18n="display_limit">顯示上限</span>
                                <input type="number" id="maxDisplayPoints" value="50000" min="1000" step="1000" oninput="syncMaxDisplayPoints('number'); drawChart()" class="w-28 border p-1 rounded text-right outline-none focus:border-blue-400">
                                <span class="text-slate-400" data-i18n="records_unit">筆</span>
                            </div>
                            <input type="range" id="maxDisplayPointsRange" min="1000" max="200000" step="1000" value="50000" oninput="syncMaxDisplayPoints('range'); drawChart()" class="w-full">
                        </div>
                    </div>
                </section>

                <section class="space-y-3">
                    <h3 class="font-bold text-slate-800 border-b pb-1" data-i18n="marker_color">標點顏色</h3>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1" data-i18n="bg_theme">底色主題</label>
                            <select id="themeMode" onchange="drawChart()" class="w-full border-2 border-slate-100 p-2 rounded-lg bg-white text-sm">
                                <option value="light" selected data-i18n-opt="theme_light">白底</option>
                                <option value="dark" data-i18n-opt="theme_dark">黑底</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1" data-i18n="color_mode">顏色模式</label>
                            <select id="colorMode" onchange="updateColorControls(); drawChart()" class="w-full border-2 border-slate-100 p-2 rounded-lg bg-white text-sm">
                                <option value="param" data-i18n-opt="color_param">依參數色階</option>
                                <option value="single" selected data-i18n-opt="color_single">單一顏色</option>
                            </select>
                        </div>
                        <div id="singleColorControls">
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1" data-i18n="single_color">單一顏色</label>
                            <input type="color" id="singleMarkerColor" value="#1e3a8a" onchange="drawChart()" class="w-full h-9 border border-slate-200 rounded bg-white">
                        </div>
                        <div id="paramColorControls" class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-1" data-i18n="color_param_label">著色參數</label>
                                <select id="colorParam" class="highlight-important" onchange="resetColorRange(); drawChart()">
                                    <option value="a" selected data-i18n-opt="param_a">半長軸 a (au)</option>
                                    <option value="e" data-i18n-opt="param_e">偏心率 e</option>
                                    <option value="i" data-i18n-opt="param_i">軌道傾角 i (deg)</option>
                                    <option value="H" data-i18n-opt="param_H">絕對星等 H</option>
                                    <option value="q" data-i18n-opt="param_q">近日距 q (au)</option>
                                    <option value="Q" data-i18n-opt="param_Q">遠日距 Q (au)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 block mb-1" data-i18n="color_range">色階範圍</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" id="colorMin" onchange="drawChart()" step="any" class="border p-1.5 rounded bg-white text-sm" placeholder="最小">
                                    <input type="number" id="colorMax" onchange="drawChart()" step="any" class="border p-1.5 rounded bg-white text-sm" placeholder="最大">
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-slate-100 pt-3">
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2" data-i18n="marker_size">標點大小（圖表資料點）</label>
                            <div class="flex items-center gap-3">
                                <input type="range" id="chartPointSizeSlider" min="1" max="10" value="3" step="1" oninput="onChartPointSizeChange(this.value)" class="flex-1 accent-blue-600">
                                <span id="chartPointSizeValue" class="text-sm font-bold text-slate-700 w-5 text-center">3</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </details>

        <section class="space-y-4 order-2">
            <h3 class="font-bold text-slate-800 border-b pb-1" data-i18n="axis_title">坐標物理量</h3>
            <div class="grid grid-cols-1 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">X <span data-i18n="axis_label">軸</span></label>
                    <select id="xAxis" class="highlight-important" onchange="handleAxisChange('x')">
                        <option value="a" selected data-i18n-opt="param_a">半長軸 a (au)</option>
                        <option value="e" data-i18n-opt="param_e">偏心率 e</option>
                        <option value="i" data-i18n-opt="param_i">軌道傾角 i (deg)</option>
                        <option value="H" data-i18n-opt="param_H">絕對星等 H</option>
                        <option value="q" data-i18n-opt="param_q">近日距 q (au)</option>
                        <option value="Q" data-i18n-opt="param_Q">遠日距 Q (au)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Y <span data-i18n="axis_label">軸</span></label>
                    <select id="yAxis" class="highlight-important" onchange="handleAxisChange('y')">
                        <option value="a" data-i18n-opt="param_a">半長軸 a (au)</option>
                        <option value="e" selected data-i18n-opt="param_e">偏心率 e</option>
                        <option value="i" data-i18n-opt="param_i">軌道傾角 i (deg)</option>
                        <option value="H" data-i18n-opt="param_H">絕對星等 H</option>
                        <option value="q" data-i18n-opt="param_q">近日距 q (au)</option>
                        <option value="Q" data-i18n-opt="param_Q">遠日距 Q (au)</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="order-3">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-slate-800" data-i18n="range_control">數值範圍控制</h3>
                <div class="flex gap-1">
                    <button onclick="setView('inner')" class="text-[10px] bg-slate-100 px-2 py-1 rounded hover:bg-blue-100 transition-colors" data-i18n="inner_solar">內太陽系</button>
                    <button onclick="setView('outer')" class="text-[10px] bg-slate-100 px-2 py-1 rounded hover:bg-blue-100 transition-colors" data-i18n="outer_solar">外太陽系</button>
                </div>
            </div>
            <div class="space-y-3">
                <div class="bg-slate-50 p-2 rounded-xl">
                    <label class="text-[10px] font-bold text-slate-400 block mb-1" data-i18n="x_range">X 軸範圍 (水平)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="xMin" onchange="updateChartRange()" step="any" class="border p-1.5 rounded bg-white text-sm" placeholder="最小">
                        <input type="number" id="xMax" onchange="updateChartRange()" step="any" class="border p-1.5 rounded bg-white text-sm" placeholder="最大">
                    </div>
                </div>
                <div class="bg-slate-50 p-2 rounded-xl">
                    <label class="text-[10px] font-bold text-slate-400 block mb-1" data-i18n="y_range">Y 軸範圍 (垂直)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="yMin" onchange="updateChartRange()" step="any" class="border p-1.5 rounded bg-white text-sm" placeholder="最小">
                        <input type="number" id="yMax" onchange="updateChartRange()" step="any" class="border p-1.5 rounded bg-white text-sm" placeholder="最大">
                    </div>
                </div>
                <p class="text-[10px] text-slate-400 italic" data-i18n="zoom_tip">💡 提示：可直接在圖表上捲動縮放或拖曳軸線。</p>
            </div>
        </section>

        <section class="order-5 text-[11px] text-slate-500 leading-relaxed border-t border-slate-200 pt-3" data-i18n="footer_credit">
            臺中市立惠文高中地球科學吳秉勳教師製作
        </section>
    </aside>

    <section id="chartSection" class="flex-1 relative bg-white">
        <div id="chart" class="w-full h-full"></div>
        <div id="orbitPlanePanel" class="hidden absolute right-4 bottom-4 z-20 bg-white border border-slate-200 rounded-lg shadow-2xl overflow-hidden" style="resize: both; min-width: 420px; min-height: 320px;">
            <div class="h-10 px-3 flex items-center justify-between border-b border-slate-200">
                <div>
                    <div class="text-sm font-bold text-slate-800" data-i18n="orbit_plane_title">軌道平面圖</div>
                    <div id="orbitPlaneSubtitle" class="text-[10px] text-slate-500 leading-none" data-i18n="orbit_plane_hint">請先搜尋或點選一顆天體</div>
                </div>
                <button onclick="hideOrbitPlanePanel()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 rounded px-2 py-1 text-xs" data-i18n="close_btn">關閉</button>
            </div>
            <div id="orbitPlaneChart" class="w-full" style="height: calc(100% - 40px);"></div>
        </div>
    </section>
</main>

<script>
// ── 國際化 (i18n) 系統 ──
window.currentLang = 'en';

const I18N = {

function pName(planet) { return (window.currentLang==='en') ? planet.nameEn : planet.name; }

function getHighVisibilityLines(xParam, yParam) {
    const traces=[], annotations=[], shapes=[];
    const showZones = document.getElementById('showZones').checked;
    const showCustomRes = document.getElementById('showCustomRes').checked;
    const theme = getThemePalette();
    const makeLabel = (text,color) => ({ text, showarrow:false, font:{size:10,color:theme.labelText||color}, bgcolor:theme.labelBg, bordercolor:color, borderpad:3, opacity:0.95 });
    const addAxisGuide = (axisName,value,label,color,opts={}) => {
        const line = { color, width:opts.width||1, dash:opts.dash||'dot' };
        const lb = makeLabel(label,color);
        if (xParam===axisName) { shapes.push({type:'line',xref:'x',yref:'paper',x0:value,x1:value,y0:0,y1:1,line,layer:'below'}); annotations.push({...lb,xref:'x',yref:'paper',x:value,y:opts.labelY??0.88,textangle:-90,xanchor:'left',yanchor:'top'}); }
        if (yParam===axisName) { shapes.push({type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:value,y1:value,line,layer:'below'}); annotations.push({...lb,xref:'paper',yref:'y',x:opts.labelX??0.96,y:value,xanchor:'right',yanchor:'middle'}); }
    };
    const addCurveAnnotation = (x,y,label,color) => annotations.push({...makeLabel(label,color),xref:'x',yref:'y',x,y,xanchor:'left',yanchor:'middle'});

    if (showZones) {
        GUIDE_LINES.forEach((g,idx) => {
            const gl = (window.currentLang==='en') ? g.labelEn : g.label;
            addAxisGuide('a',g.value,gl,g.color,{dash:g.dash,width:g.width,labelY:0.90,labelX:0.96});
        });
        ORBIT_REFERENCE_PLANETS.forEach((planet,idx) => {
            const pn = pName(planet);
            ['a','q','Q','i'].forEach(axisName => {
                const isQ = axisName==='Q';
                const guideColor = isQ ? '#fca5a5' : (theme.isDark?'#cbd5e1':'#475569');
                addAxisGuide(axisName,planet[axisName],`${pn} ${ORBIT_AXIS_LABEL[axisName]}`,guideColor,{dash:isQ?'solid':'dot',width:axisName==='a'?1.2:(isQ?1.4:1),labelY:0.75,labelX:0.90-(idx%4)*0.055});
            });
        });
        if ((xParam==='a'&&yParam==='e')||(xParam==='e'&&yParam==='a')) {
            MAJOR_PLANETS.filter(p=>["Venus","Earth","Mars","Jupiter"].includes(p.id)).forEach(p => {
                const ax_q=[],ey_q=[];
                for(let v=Math.max(p.q,0.1);v<=100;v+=0.1){const eV=1-p.q/v;if(eV>=0&&eV<=1){ax_q.push(v);ey_q.push(eV);}}
                traces.push({x:xParam==='a'?ax_q:ey_q,y:xParam==='a'?ey_q:ax_q,mode:'lines',line:{color:"#ef4444",width:1.2,opacity:0.42},hoverinfo:'skip'});
                const ax_Q=[],ey_Q=[];
                for(let v=0.1;v<=p.Q;v+=0.1){const eV=p.Q/v-1;if(eV>=0&&eV<=1){ax_Q.push(v);ey_Q.push(eV);}}
                traces.push({x:xParam==='a'?ax_Q:ey_Q,y:xParam==='a'?ey_Q:ax_Q,mode:'lines',line:{color:"#fca5a5",width:1.2,opacity:0.55,dash:'solid'},hoverinfo:'skip'});
                const pn=pName(p);
                const qLA=Math.min(Math.max(p.q+0.55,1.0),5.4),qLE=1-p.q/qLA;
                if(qLE>=0&&qLE<=1) addCurveAnnotation(xParam==='a'?qLA:qLE,xParam==='a'?qLE:qLA,`${pn} q`,'#ef4444');
                const QLA=Math.max(Math.min(p.Q*0.78,5.4),0.4),QLE=p.Q/QLA-1;
                if(QLE>=0&&QLE<=1) addCurveAnnotation(xParam==='a'?QLA:QLE,xParam==='a'?QLE:QLA,`${pn} Q`,'#fca5a5');
            });
        }
    }

function degToRad(deg){return(deg||0)*Math.PI/180;}

function normalizeSearchText(text){return(text||'').toString().toLowerCase().replace(/\s+/g,'').replace(/^0+(\d+[a-z])$/,'$1').replace(/^0+(\d+[a-z])\//,'$1/');}

function makeCometSearchAliases(token,name){
    const aliases=new Set([token,name]);
    const fullText=`${token} ${name}`;
    const cometName=fullText.match(/[cpdx]\/\d{4}\s*[a-z0-9]+(?:\s*\([^)]+\))?/i);
    if(cometName)aliases.add(cometName[0]);
    const periodic=fullText.match(/\b0*(\d+)p\b/i);
    if(periodic){const pN=`${periodic[1]}P`;aliases.add(pN);const sN=fullText.match(/\b0*\d+p\/([^\s(]+)/i);if(sN){aliases.add(`${pN}/${sN[1]}`);aliases.add(sN[1]);}const par=fullText.match(/\(([^)]+)\)/);if(par)aliases.add(`${pN}/${par[1]}`);}
    return Array.from(aliases).map(normalizeSearchText).filter(Boolean).join(' ');
}

function buildEllipseOrbitPoints(a,e,steps=360,rotationRad=0){
    const x=[],y=[],b=a*Math.sqrt(Math.max(0,1-e*e)),cosR=Math.cos(rotationRad),sinR=Math.sin(rotationRad);
    for(let k=0;k<=steps;k++){const E=(Math.PI*2*k)/steps,rX=a*(Math.cos(E)-e),rY=b*Math.sin(E);x.push(rX*cosR-rY*sinR);y.push(rX*sinR+rY*cosR);}
    return{x,y};
}

function buildOpenConicOrbitPoints(q,e,maxR,steps=720,rotationRad=0){
    const x=[],y=[],p=q*(1+e),limit=e>1?Math.acos(-1/e)-0.01:Math.PI-0.02,cosR=Math.cos(rotationRad),sinR=Math.sin(rotationRad);
    for(let k=0;k<=steps;k++){const f=-limit+(2*limit*k)/steps,denom=1+e*Math.cos(f);if(denom<=0.0001){x.push(null);y.push(null);continue;}const r=p/denom;if(!Number.isFinite(r)||r>maxR){x.push(null);y.push(null);continue;}x.push(r*Math.cos(f)*cosR-r*Math.sin(f)*sinR);y.push(r*Math.cos(f)*sinR+r*Math.sin(f)*cosR);}
    return{x,y};
}

function solveKeplerEllipse(M,e){let E=M;for(let i=0;i<8;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-8)break;}return E;}
function getOrbitLongitudeRad(item){return degToRad((item.node||0)+(item.peri||0));}

function computePlanePosition(item){
    if(!item||!Number.isFinite(item.q)||!Number.isFinite(item.e))return null;
    const rot=getOrbitLongitudeRad(item),cosR=Math.cos(rot),sinR=Math.sin(rot);
    if(item.e<1&&Number.isFinite(item.a)&&item.a>0&&Number.isFinite(item.M)){const E=solveKeplerEllipse(degToRad(item.M%360),item.e),rX=item.a*(Math.cos(E)-item.e),rY=item.a*Math.sqrt(Math.max(0,1-item.e*item.e))*Math.sin(E);return{x:rX*cosR-rY*sinR,y:rX*sinR+rY*cosR};}
    return{x:item.q*cosR,y:item.q*sinR};
}

function createDatasetItem(index){return{a:asteroidData.a[index],e:asteroidData.e[index],i:asteroidData.i[index],H:asteroidData.H[index],q:asteroidData.q[index],Q:asteroidData.Q[index],name:asteroidData.name[index],id:asteroidData.id[index],M:asteroidData.M?.[index],peri:asteroidData.peri?.[index],node:asteroidData.node?.[index]};}

function getOrbitPlaneExtent(item){
    const pe=Math.max(...ORBIT_PLANE_PLANETS.map(p=>p.Q||p.a*(1+p.e)));
    let oe=0;if(item&&Number.isFinite(item.e)&&Number.isFinite(item.q)){if(item.e<1&&Number.isFinite(item.Q))oe=item.Q;else oe=Math.max(pe,item.q*12);}
    return Math.min(80,Math.max(pe,oe,6)*1.08);
}

}

function classifyAsteroid(a,q,Q,i,e=null){
    const orbit={a,q,Q,i,e:e??Math.max(0,1-q/a)};
    const matches=GROUP_RULES.filter(r=>r.test(orbit)).sort((l,r)=>r.priority-l.priority);
    const fallback={label:"未歸入主要族群",labelEn:"Unclassified",color:"#64748b",desc:"目前規則未對應到明確的小行星族群",descEn:"No matching classification rule found",priority:0};
    const primary=matches[0]||fallback;
    const secondary=matches.slice(1).filter(r=>r.label!==primary.label).slice(0,3);
    return{...primary,primary,secondary,matches};
}

function triggerSearchById(id){if(!asteroidData)return;const idx=asteroidData.id.indexOf(id);if(idx!==-1){searchResult=createDatasetItem(idx);updateSearchCard(searchResult);drawChart();}}

function performSearch(){
    const query=normalizeSearchText(document.getElementById('searchInput').value);
    if(!query){searchResult=null;updateSearchCard(null);return drawChart();}
    const planet=MAJOR_PLANETS.find(p=>normalizeSearchText(p.id)===query||normalizeSearchText(p.name)===query||normalizeSearchText(p.nameEn)===query);
    if(planet){searchResult=planet;updateSearchCard(planet);return drawChart();}
    if(asteroidData){const idx=asteroidData.searchKeys.findIndex(k=>k.includes(query));if(idx!==-1){searchResult=createDatasetItem(idx);updateSearchCard(searchResult);}}
    drawChart();
}

function parseMpcorbLines(lines){
    const p=makeEmptyDataset();
    lines.forEach(line=>{if(line.length>110){const a=parseFloat(line.substring(POS.a[0],POS.a[1])),e=parseFloat(line.substring(POS.e[0],POS.e[1]));if(!isNaN(a)&&!isNaN(e)){p.a.push(a);p.e.push(e);p.id.push(line.substring(POS.id[0],POS.id[1]).trim()||`MPC-${p.a.length}`);p.name.push(line.substring(POS.name[0],POS.name[1]).trim()||"unnamed");p.i.push(parseFloat(line.substring(POS.i[0],POS.i[1]))||0);p.H.push(parseFloat(line.substring(POS.H[0],POS.H[1]))||0);p.M.push(parseFloat(line.substring(POS.M[0],POS.M[1]))||0);p.peri.push(parseFloat(line.substring(POS.peri[0],POS.peri[1]))||0);p.node.push(parseFloat(line.substring(POS.node[0],POS.node[1]))||0);p.q.push(a*(1-e));p.Q.push(a*(1+e));p.searchKeys.push(normalizeSearchText(`${p.id[p.id.length-1]} ${p.name[p.name.length-1]}`));}}});
    return p;
}

function parseCometElsLines(lines){
    const p=makeEmptyDataset();
    lines.forEach(line=>{
        if(!line||!line.trim())return;const first=line.trim()[0];if(first==='#')return;
        const parts=line.trim().split(/\s+/);if(parts.length<12)return;
        const token=parts[0],q=parseFloat(parts[4]),e=parseFloat(parts[5]),iDeg=parseFloat(parts[8]),hLike=parseFloat(parts[10]);
        if(!Number.isFinite(q)||!Number.isFinite(e)||!Number.isFinite(iDeg)||q<=0||e<=0)return;
        let a=q/(1-e),Q=a*(1+e);
        if(e>=1||!Number.isFinite(a)||a<=0)a=0;
        if(!Number.isFinite(Q)||Q<=0)Q=Math.min(1000,q*(1+Math.max(e,1)));
        a=Math.min(1000,Math.max(0,a));Q=Math.min(1000,Q);
        const segments=line.trimEnd().split(/\s{2,}/);
        const nameSeg=segments.find(seg=>/^(?:[CPDX]\/.+(?:\([^)]+\))?|\d+P\/.+)$/i.test(seg.trim()));
        const prettyName=(nameSeg||token).trim();
        p.a.push(a);p.e.push(e);p.i.push(iDeg);p.H.push(Number.isFinite(hLike)?hLike:12);p.q.push(q);p.Q.push(Q);p.M.push(0);p.peri.push(parseFloat(parts[6])||0);p.node.push(parseFloat(parts[7])||0);p.id.push(token);p.name.push(prettyName);p.searchKeys.push(makeCometSearchAliases(token,prettyName));
    });
    return p;
}

function parseMpcorbText(text){
    const lines=text.split('\n');
    const firstNonEmpty=lines.find(l=>l.trim().length>0)||'';
    const isCometEls=firstNonEmpty.includes('/')||firstNonEmpty.startsWith('C')||firstNonEmpty.startsWith('P');
    const parsed=isCometEls?parseCometElsLines(lines):parseMpcorbLines(lines);
    if(!parsed.a.length){document.getElementById('dataStatus').innerText=T('parse_fail');document.getElementById('loadingOverlay').style.display='none';return;}
    finalizeLoadedData(parsed,isCometEls?'CometEls':'MPCORB');
}

document.getElementById('fileInput').addEventListener('change',function(e){
    const file=e.target.files[0];if(!file)return;
    document.getElementById('loadingOverlay').style.display='flex';
    const reader=new FileReader();
    reader.onload=event=>parseMpcorbText(event.target.result);
    reader.readAsText(file);
});

// ── 拖曳上傳 ──────────────────────────────────────────────
(function(){
    let dragCounter=0;

    function processFile(file){
        if(!file)return;
        document.getElementById('loadingOverlay').style.display='flex';
        const reader=new FileReader();
        reader.onload=event=>parseMpcorbText(event.target.result);
        reader.readAsText(file);
    }

    document.addEventListener('dragenter',function(e){
        if(!e.dataTransfer.types.includes('Files'))return;
        e.preventDefault();
        if(++dragCounter===1){
            document.getElementById('dragOverlay').classList.add('active');
            document.body.classList.add('drag-active');
        }
    });
    document.addEventListener('dragover',function(e){
        if(!e.dataTransfer.types.includes('Files'))return;
        e.preventDefault();
        e.dataTransfer.dropEffect='copy';
    });
    document.addEventListener('dragleave',function(){
        if(--dragCounter<=0){
            dragCounter=0;
            document.getElementById('dragOverlay').classList.remove('active');
            document.body.classList.remove('drag-active');
        }
    });
    document.addEventListener('drop',function(e){
        e.preventDefault();
        dragCounter=0;
        document.getElementById('dragOverlay').classList.remove('active');
        document.body.classList.remove('drag-active');
        processFile(e.dataTransfer.files[0]);
    });
})();

window.onload=()=>{resetColorRange();updateColorControls();syncMaxDisplayPoints('number');handleAxisChange();applyI18n('en');};
